<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F0">
  <title>Mezon — xodimlar konsoli</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>
    try { var t = JSON.parse(localStorage.getItem("mezon.theme") || '"auto"'); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="vendor/fonts/inter.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="vendor/tailwind-play-3.4.16.js"></script>
  <script>tailwind.config = { corePlugins: { preflight: false }, theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };</script>
  <script src="vendor/lucide-0.460.0.min.js"></script>
  <script src="vendor/chart-4.4.6.umd.min.js"></script>
</head>
<body>
  <div class="console">
    <aside class="side" aria-label="Konsol bo'limlari">
      <a href="#/approvals" class="flex items-center gap-2 mb-3" style="text-decoration:none;color:var(--text)">
        <img src="assets/logo-mark.svg" width="32" height="32" alt="">
        <span><span class="t-18" style="font-weight:600">Mezon</span><span class="block t-12 muted" style="line-height:1">xodimlar konsoli</span></span>
      </a>
      <a class="nav" href="#/approvals" data-nav="/approvals"><i data-lucide="user-check"></i>So'rovlar<span class="flex-1"></span><span class="pill tone-amber" id="pendingCount" hidden></span></a>
      <a class="nav" href="#/rules" data-nav="/rules"><i data-lucide="sparkles"></i>AI qoidalari</a>
      <a class="nav" href="#/maker" data-nav="/maker"><i data-lucide="chart-column"></i>Ishlab chiqaruvchi</a>
      <div class="flex-1"></div>
      <div class="side-foot grid gap-2">
        <label class="label t-12 muted" for="role" style="margin:0">Rol (DEMO_MODE)</label>
        <select class="select" id="role">
          <option value="pharmacist">Farmatsevt</option>
          <option value="maker">Ishlab chiqaruvchi</option>
          <option value="admin">Admin</option>
        </select>
        <div class="seg" role="group" aria-label="Mavzu">
          <button data-theme-opt="auto" aria-label="Avto"><i data-lucide="monitor"></i></button>
          <button data-theme-opt="light" aria-label="Yorug'"><i data-lucide="sun"></i></button>
          <button data-theme-opt="dark" aria-label="Qorong'i"><i data-lucide="moon"></i></button>
        </div>
        <a class="btn btn-sm" href="/" target="_blank" rel="noopener"><i data-lucide="smartphone"></i>Bemor ilovasi</a>
        <span class="demo-badge justify-center">Demo ma'lumot</span>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <script type="module" src="js/staff.js"></script>
</body>
</html>
